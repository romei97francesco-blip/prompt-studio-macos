name: Verifica

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Esegui i test isolati
        run: ./Sorgenti/test.sh

      - name: Compila l'app
        run: ./Sorgenti/compila.sh

      - name: Verifica il pacchetto
        run: |
          test -x "Prompt Studio.app/Contents/MacOS/PromptStudio"
          test -f "Prompt Studio.app/Contents/Resources/PromptStudio.icns"
          plutil -lint "Prompt Studio.app/Contents/Info.plist"

